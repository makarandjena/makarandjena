<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Evaluation</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 700px; margin: auto; }
    .result { white-space: pre-wrap; background: #f9f9f9; padding: 1rem; margin-top: 1rem; border: 1px solid #ccc; }
    button { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>Project Evaluation</h1>

  <input type="file" id="zipFile" accept=".zip" />
  <button onclick="analyzeZip()">Analyze</button>

  <div id="result" class="result"></div>

  <div id="actions" style="margin-top: 1rem; display: none;">
    <button onclick="saveToSheet()">Save to Google Sheet</button>
    <button onclick="window.print()">Print</button>
  </div>

  <script>
    let analysisResult = null;

    async function analyzeZip() {
      const fileInput = document.getElementById('zipFile');
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a ZIP file.');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch('/.netlify/functions/analyze', {
        method: 'POST',
        body: formData,
      });

      const data = await res.json();
      analysisResult = data;

      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      document.getElementById('actions').style.display = 'block';
    }

    async function saveToSheet() {
      if (!analysisResult) return;

      await fetch('/.netlify/functions/save-to-sheet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ analysis: analysisResult }),
      });

      alert('Saved to Google Sheet!');
    }
  </script>
</body>
</html>

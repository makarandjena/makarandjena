<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script>
      async function sendData() {
        const data = {
          internId: document.getElementById('internId').value,
          internName: document.getElementById('internName').value,
          domainName: document.getElementById('domainName').value,
          analysis: document.getElementById('analysis').value
        };

        const response = await fetch(
          'https://script.google.com/macros/s/YOUR_DEPLOYED_SCRIPT_ID/exec', 
          {
            method: 'POST',
            contentType: 'application/json',
            body: JSON.stringify(data)
          }
        );

        const result = await response.json();
        alert('Response: ' + result.status);
      }
    </script>
  </head>
  <body>
    <h3>Submit Evaluation</h3>
    <input id="internId" placeholder="Intern ID" /><br><br>
    <input id="internName" placeholder="Intern Name" /><br><br>
    <input id="domainName" placeholder="Domain Name" /><br><br>
    <input id="analysis" placeholder="Evaluation Result" /><br><br>
    <button onclick="sendData()">Submit</button>
  </body>
</html>

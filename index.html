<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
      }
      input[type="file"] {
        margin-top: 20px;
      }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        border: none;
        background-color: #4CAF50;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
      .result {
        margin-top: 30px;
        background: #f9f9f9;
        padding: 15px;
        border-radius: 8px;
      }
      ul {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Project Evaluation - Upload ZIP File</h2>
    <input type="file" id="zipFile" accept=".zip" />
    <br/>
    <button onclick="handleUpload()">Upload & Extract</button>
    
    <div class="result" id="result" style="display:none;">
      <h3>Analysis Result:</h3>
      <p id="message"></p>
      <ul id="fileList"></ul>
    </div>

    <script>
      function handleUpload() {
        const fileInput = document.getElementById('zipFile');
        const file = fileInput.files[0];
        if (!file) {
          alert('Please select a ZIP file first.');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          const base64 = dataUrl.split(',')[1];  // Remove metadata

          google.script.run.withSuccessHandler(displayResult)
            .uploadAndExtractZip(base64, file.name);
        };
        reader.readAsDataURL(file);
      }

      function displayResult(result) {
        const resultDiv = document.getElementById('result');
        const message = document.getElementById('message');
        const fileList = document.getElementById('fileList');

        resultDiv.style.display = 'block';
        message.textContent = result.message;
        fileList.innerHTML = '';

        if (result.success) {
          result.files.forEach(name => {
            const li = document.createElement('li');
            li.textContent = name;
            fileList.appendChild(li);
          });
        }
      }
    </script>
  </body>
</html>

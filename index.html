<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial; padding: 20px; }
      input, textarea, button { margin: 10px 0; width: 100%; max-width: 500px; }
      #progressContainer { width: 100%; background: #f0f0f0; border-radius: 5px; margin-top: 10px; }
      #progressBar { height: 20px; width: 0%; background: #4CAF50; text-align: center; color: white; border-radius: 5px; }
    </style>
  </head>
  <body>
    <h2>Intern Project Evaluation</h2>
    <input type="file" id="zipFile" accept=".zip"><br>
    <textarea id="customPrompt" rows="4" placeholder="Optional prompt for Gemini analysis..."></textarea><br>
    <button onclick="uploadFile()">Upload & Analyze</button>

    <div id="progressContainer">
      <div id="progressBar">0%</div>
    </div>

    <div id="status"></div>

    <script>
      function uploadFile() {
        const fileInput = document.getElementById("zipFile");
        const file = fileInput.files[0];
        const prompt = document.getElementById("customPrompt").value;
        if (!file) {
          document.getElementById("status").innerText = "Please select a ZIP file.";
          return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          const fileData = e.target.result.split(',')[1];
          document.getElementById("status").innerHTML = "";
          document.getElementById("progressBar").style.width = '0%';
          document.getElementById("progressBar").innerText = '0%';

          google.script.run
            .withSuccessHandler(function (results) {
              const output = results.map(r => `<p><strong>${r.filename}</strong><br>${r.evaluation}</p>`).join('');
              document.getElementById("status").innerHTML = "<hr><b>Analysis Complete:</b><br>" + output;
            })
            .withFailureHandler(function (err) {
              document.getElementById("status").innerText = "Error: " + err.message;
            })
            .processZipFile({
              fileData: fileData,
              mimeType: file.type,
              fileName: file.name,
              prompt: prompt,
              onProgressCallback: google.script.run.withSuccessHandler(updateProgress)
            });
        };
        reader.readAsDataURL(file);
      }

      function updateProgress(progress) {
        const percent = Math.round((progress.index / progress.total) * 100);
        const progressBar = document.getElementById("progressBar");
        progressBar.style.width = percent + "%";
        progressBar.innerText = percent + "%";

        const status = document.getElementById("status");
        status.innerHTML += `<p><strong>${progress.filename}</strong> processed.</p>`;
      }
    </script>
  </body>
</html>

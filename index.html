<!DOCTYPE html>
<html>
<head>
  <title>Upload Project</title>
  <script>
    async function uploadData() {
      const form = document.getElementById("uploadForm");
      const formData = new FormData(form);

      const response = await fetch("https://docs.google.com/spreadsheets/d/145qozjhpfOUM77tfv49b2gN-lBvmi6CqMvKv6eRDLMs/edit?gid=0#gid=0", {
        method: "POST",
        body: formData
      });

      const result = await response.json();
      alert("Response: " + result.message);
    }
  </script>
</head>
<body>
  <h3>Upload Project Zip</h3>
  <form id="uploadForm" onsubmit="event.preventDefault(); uploadData();">
    <input type="text" name="internId" placeholder="Intern ID" required /><br><br>
    <input type="text" name="internName" placeholder="Intern Name" required /><br><br>
    <input type="text" name="domainName" placeholder="Domain Name" required /><br><br>
    <input type="text" name="analysis" placeholder="Evaluation Result" required /><br><br>
    <input type="file" name="zipFile" accept=".zip" required /><br><br>
    <button type="submit">Upload & Submit</button>
  </form>
</body>
</html>

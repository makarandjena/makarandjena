<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      h2 { color: #333; }
      .section { margin-bottom: 20px; }
      .result { background: #f5f5f5; padding: 10px; border-radius: 5px; }
      button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
      .btn-group { margin-top: 20px; }
    </style>
  </head>
  <body>
    <h2>Intern Project Evaluation</h2>
    <div class="section">
      <form id="uploadForm">
        <label>Select ZIP File:</label>
        <input type="file" name="zipFile" accept=".zip" required />
        <div class="btn-group">
          <button type="submit">Scan & Analyze</button>
        </div>
      </form>
    </div>

    <div id="result" class="section" style="display:none;">
      <h3>Evaluation Result</h3>
      <div class="result" id="evaluationResult"></div>
      <div class="btn-group">
        <button onclick="saveDetails()">Save Details to Google Sheet</button>
        <button onclick="window.print()">Print Report</button>
      </div>
    </div>

    <script>
      let internData = {};

      document.getElementById("uploadForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const fileInput = document.querySelector('input[name="zipFile"]');
        const file = fileInput.files[0];

        if (!file) {
          alert("Please select a ZIP file.");
          return;
        }

        const fr = new FileReader();
        fr.onload = function() {
          const bytes = [...new Uint8Array(fr.result)];
          google.script.run.withSuccessHandler(displayResult).uploadZipFile({ zipFile: { bytes, name: file.name } });
        };
        fr.readAsArrayBuffer(file);
      });

      function displayResult(data) {
        internData = data;
        const resultDiv = document.getElementById("evaluationResult");
        resultDiv.innerHTML = `
          <strong>Intern ID:</strong> ${data.internId}<br>
          <strong>Name:</strong> ${data.internName}<br>
          <strong>Domain:</strong> ${data.domain}<br>
          <strong>Documentation Quality:</strong> <b>${data.docQuality}</b><br>
          <strong>Files Extracted:</strong> <ul>${data.extractedFiles.map(f => `<li>${f}</li>`).join('')}</ul>
        `;
        document.getElementById("result").style.display = "block";
      }

      function saveDetails() {
        google.script.run.withSuccessHandler(() => {
          alert("Details saved to Google Sheet.");
        }).saveToSheet(internData);
      }
    </script>
  </body>
</html>

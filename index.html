<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 25px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background-color: #fefefe;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #333;
      }
      input[type="file"] {
        display: block;
        margin: 20px auto;
      }
      button {
        display: block;
        margin: 10px auto;
        padding: 10px 20px;
        background-color: #4285F4;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #3367D6;
      }
      .result {
        margin-top: 30px;
        padding: 15px;
        border-radius: 8px;
        background-color: #f1f1f1;
      }
      ul {
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <h2>Upload & Analyze ZIP File</h2>
    <input type="file" id="zipFile" accept=".zip">
    <button onclick="handleUpload()">Upload ZIP</button>

    <div class="result" id="result" style="display:none;">
      <h3>Extraction Result:</h3>
      <p id="statusMsg"></p>
      <ul id="fileList"></ul>
    </div>

    <script>
      function handleUpload() {
        const fileInput = document.getElementById('zipFile');
        const file = fileInput.files[0];

        if (!file) {
          alert("Please select a ZIP file to upload.");
          return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          const base64Data = e.target.result.split(',')[1];

          google.script.run.withSuccessHandler(displayResult)
            .uploadAndExtractZip(base64Data, file.name);
        };
        reader.readAsDataURL(file);
      }

      function displayResult(response) {
        const resultDiv = document.getElementById('result');
        const statusMsg = document.getElementById('statusMsg');
        const fileList = document.getElementById('fileList');

        resultDiv.style.display = 'block';
        statusMsg.textContent = response.message;
        fileList.innerHTML = '';

        if (response.success) {
          response.files.forEach(fileName => {
            const li = document.createElement('li');
            li.textContent = fileName;
            fileList.appendChild(li);
          });
        }
      }
    </script>
  </body>
</html>
